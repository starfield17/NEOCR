name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OcrWorkbench.slnx
      - run: dotnet build OcrWorkbench.slnx --no-restore
      - run: dotnet test OcrWorkbench.slnx --no-build
      - run: dotnet format OcrWorkbench.slnx --no-restore --verify-no-changes
      - run: dotnet list OcrWorkbench.slnx package --vulnerable --include-transitive
